<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MyTodo - 个人任务与日历</title>
  
  <!-- PWA iOS & Theme Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MyTodo">
  <meta name="theme-color" content="#4772FA">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#4772FA',
              hover: '#3b62d9',
              light: '#EEF2FF',
              dark: '#2e4ebd'
            }
          }
        }
      }
    }
  </script>

  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    (function setupPWA() {
      const manifest = {
        name: "MyTodo Task & Calendar",
        short_name: "MyTodo",
        start_url: "./",
        display: "standalone",
        background_color: "#F5F5F5",
        theme_color: "#4772FA",
        icons: [
          {
            src: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%234772FA'><rect width='512' height='512' rx='100' fill='%234772FA'/><path d='M381 181L214 348L131 265' stroke='white' stroke-width='48' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>",
            sizes: "192x192 512x512",
            type: "image/svg+xml",
            purpose: "any maskable"
          }
        ]
      };
      const manifestStr = JSON.stringify(manifest);
      const manifestBlob = new Blob([manifestStr], { type: 'application/json' });
      const manifestURL = URL.createObjectURL(manifestBlob);
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestURL;
      document.head.appendChild(link);

      // Register Service Worker from Blob URL for background system reminders
      if ('serviceWorker' in navigator) {
        const swCode = `
          const CACHE_NAME = 'mytodo-v3';
          let scheduledTimers = [];

          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
          self.addEventListener('fetch', (e) => {
            e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
          });
          self.addEventListener('notificationclick', (e) => {
            e.notification.close();
            e.waitUntil(clients.matchAll({ type: 'window', includeUncontrolled: true }).then((clientList) => {
              for (let client of clientList) {
                if ('focus' in client) return client.focus();
              }
              if (clients.openWindow) return clients.openWindow('/');
            }));
          });

          // Handle background system reminders
          self.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'SCHEDULE_REMINDERS') {
              scheduledTimers.forEach(t => clearTimeout(t));
              scheduledTimers = [];
              const reminders = e.data.reminders || [];
              reminders.forEach(item => {
                const delay = item.time - Date.now();
                if (delay > 0) {
                  if ('showTrigger' in Notification.prototype && (typeof TimestampTrigger !== 'undefined' || 'TimestampTrigger' in self)) {
                    try {
                      const TriggerClass = typeof TimestampTrigger !== 'undefined' ? TimestampTrigger : self.TimestampTrigger;
                      self.registration.showNotification('MyTodo 任务提醒', {
                        body: item.title + (item.dueDate ? ' (' + item.dueDate + ')' : ''),
                        icon: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%234772FA'><rect width='512' height='512' rx='100'/><path d='M381 181L214 348L131 265' stroke='white' stroke-width='48' stroke-linecap='round' fill='none'/></svg>",
                        showTrigger: new TriggerClass(item.time),
                        tag: 'reminder-' + item.id,
                        requireInteraction: true,
                        vibrate: [200, 100, 200, 100, 200]
                      });
                    } catch(err) {}
                  }
                  
                  const timerId = setTimeout(() => {
                    self.registration.showNotification('MyTodo 任务提醒', {
                      body: item.title + (item.dueDate ? ' (' + item.dueDate + ')' : ''),
                      icon: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%234772FA'><rect width='512' height='512' rx='100'/><path d='M381 181L214 348L131 265' stroke='white' stroke-width='48' stroke-linecap='round' fill='none'/></svg>",
                      tag: 'reminder-' + item.id,
                      requireInteraction: true,
                      vibrate: [200, 100, 200, 100, 200]
                    });
                  }, delay);
                  scheduledTimers.push(timerId);
                }
              });
            }
          });
        `;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        const swURL = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swURL).then(reg => {
          window.swRegistration = reg;
          navigator.serviceWorker.ready.then(() => {
            if (typeof syncRemindersToSW === 'function') syncRemindersToSW();
          });
        }).catch(() => {});
      }
    })();
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F5F5F5;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }

    .fade-in {
      animation: fadeIn 0.2s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes ring-pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(71, 114, 250, 0.6); }
      50% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(71, 114, 250, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(71, 114, 250, 0); }
    }
    .alarm-ring {
      animation: ring-pulse 1s infinite;
    }
  </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col pb-24">

  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-gray-200/80 shadow-sm px-3 py-3 sm:px-6">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-2">
      
      <div class="flex items-center space-x-2 shrink-0">
        <div class="w-8 h-8 rounded-xl bg-brand text-white flex items-center justify-center font-bold shadow-md">
          <i class="fa-solid fa-check text-sm"></i>
        </div>
        <h1 class="text-lg font-bold text-gray-900 tracking-tight">MyTodo</h1>
      </div>

      <div class="flex items-center bg-gray-100 p-1 rounded-xl text-xs font-semibold text-gray-600">
        <button onclick="switchView('list')" id="tab-list" class="view-tab px-3 py-1.5 rounded-lg transition-all">
          总览
        </button>
        <button onclick="switchView('day')" id="tab-day" class="view-tab px-3 py-1.5 rounded-lg transition-all">
          日
        </button>
        <button onclick="switchView('week')" id="tab-week" class="view-tab px-3 py-1.5 rounded-lg transition-all">
          周视图
        </button>
        <button onclick="switchView('month')" id="tab-month" class="view-tab px-3 py-1.5 rounded-lg transition-all">
          月视图
        </button>
      </div>

    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-3 sm:p-6">

    <!-- VIEW 1: OVERVIEW / LIST VIEW -->
    <section id="view-list" class="view-panel space-y-4 fade-in">
      <div class="relative flex items-center">
        <input type="text" id="search-input" oninput="renderListView()" placeholder="搜索任务标题..." 
          class="w-full pl-9 pr-8 py-2.5 text-xs sm:text-sm bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand transition-all shadow-sm">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
        <button onclick="clearSearch()" id="search-clear-btn" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>

      <div class="space-y-2">
        <div class="flex items-center space-x-2 text-xs font-bold text-gray-500 uppercase tracking-wider">
          <i class="fa-solid fa-fire text-amber-500"></i>
          <span>今天与过期任务</span>
        </div>
        <div id="list-today-container" class="space-y-2"></div>
      </div>

      <div class="space-y-2">
        <div class="flex items-center space-x-2 text-xs font-bold text-gray-500 uppercase tracking-wider">
          <i class="fa-regular fa-calendar text-brand"></i>
          <span>准备进行</span>
        </div>
        <div id="list-upcoming-container" class="space-y-2"></div>
      </div>

      <div class="space-y-2">
        <div class="flex items-center space-x-2 text-xs font-bold text-gray-400 uppercase tracking-wider">
          <i class="fa-solid fa-inbox text-gray-400"></i>
          <span>无截止日期</span>
        </div>
        <div id="list-nodate-container" class="space-y-2"></div>
      </div>

      <div class="space-y-2 pt-2">
        <button onclick="toggleCompletedList()" class="flex items-center space-x-2 text-xs font-bold text-gray-400 hover:text-gray-600 transition">
          <i id="completed-chevron" class="fa-solid fa-chevron-right text-[10px] transition-transform"></i>
          <span>已完成任务</span>
          <span id="completed-count-badge" class="bg-gray-200 text-gray-600 px-1.5 py-0.2 rounded-full text-[10px]">0</span>
        </button>
        <div id="list-completed-container" class="space-y-2 hidden"></div>
      </div>
    </section>

    <!-- VIEW 2: DAY VIEW -->
    <section id="view-day" class="view-panel space-y-4 hidden fade-in">
      <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex items-center justify-between">
        <button onclick="navigateDay(-1)" class="p-2 hover:bg-gray-100 rounded-xl transition text-gray-600 active:scale-95">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div class="text-center">
          <h2 id="day-view-title" class="text-base font-bold text-gray-800">2026年10月8日 星期四</h2>
          <div id="day-view-holiday" class="text-[11px] font-semibold text-brand mt-0.5"></div>
        </div>
        <div class="flex items-center space-x-1">
          <button onclick="navigateDayToToday()" class="text-xs bg-indigo-50 text-brand font-semibold px-2.5 py-1.5 rounded-lg hover:bg-indigo-100 transition">今天</button>
          <button onclick="navigateDay(1)" class="p-2 hover:bg-gray-100 rounded-xl transition text-gray-600 active:scale-95">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      </div>

      <div id="day-tasks-container" class="space-y-3"></div>
    </section>

    <!-- VIEW 3: WEEK OVERVIEW -->
    <section id="view-week" class="view-panel space-y-4 hidden fade-in">
      <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex items-center justify-between">
        <button onclick="navigateWeek(-1)" class="p-2 hover:bg-gray-100 rounded-xl transition text-gray-600 active:scale-95">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h2 id="week-view-title" class="text-base font-bold text-gray-800">2026年10月5日 - 10月11日</h2>
        <div class="flex items-center space-x-1">
          <button onclick="navigateWeekToToday()" class="text-xs bg-indigo-50 text-brand font-semibold px-2.5 py-1.5 rounded-lg hover:bg-indigo-100 transition">本周</button>
          <button onclick="navigateWeek(1)" class="p-2 hover:bg-gray-100 rounded-xl transition text-gray-600 active:scale-95">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      </div>

      <div id="week-grid" class="grid grid-cols-1 sm:grid-cols-7 gap-2"></div>
    </section>

    <!-- VIEW 4: MONTH OVERVIEW (TICKTICK MOBILE STYLE) -->
    <section id="view-month" class="view-panel space-y-4 hidden fade-in">
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="flex items-center justify-between p-3 border-b border-gray-100">
          <button onclick="navigateMonth(-1)" class="p-2 hover:bg-gray-100 rounded-xl transition text-gray-600 active:scale-95">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <h2 id="month-view-title" class="text-base font-bold text-gray-800">2026年 10月</h2>
          <div class="flex items-center space-x-1">
            <button onclick="navigateMonthToToday()" class="text-xs bg-indigo-50 text-brand font-semibold px-2.5 py-1.5 rounded-lg hover:bg-indigo-100 transition">本月</button>
            <button onclick="navigateMonth(1)" class="p-2 hover:bg-gray-100 rounded-xl transition text-gray-600 active:scale-95">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
        </div>

        <div class="grid grid-cols-7 border-b border-gray-100 bg-gray-50/70 text-center font-bold text-xs text-gray-500 py-2">
          <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="text-brand">六</div><div class="text-brand">日</div>
        </div>

        <div id="month-grid" class="grid grid-cols-7 divide-x divide-y divide-gray-100/80 bg-white"></div>
      </div>

      <!-- Selected Day Agenda Panel -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 space-y-3">
        <div class="flex items-center justify-between pb-2 border-b border-gray-100">
          <div class="flex items-center space-x-2">
            <div class="w-2 h-4 bg-brand rounded-full"></div>
            <h3 id="month-selected-date-title" class="text-sm sm:text-base font-bold text-gray-800">10月8日 星期四</h3>
            <span id="month-selected-date-badge" class="hidden text-[10px] font-bold px-2 py-0.5 rounded-full"></span>
          </div>
          <button onclick="addQuickTaskForSelectedMonthDate()" class="text-xs bg-brand text-white font-medium px-3 py-1.5 rounded-xl hover:bg-brand-hover transition flex items-center space-x-1 active:scale-95 shadow-sm">
            <i class="fa-solid fa-plus text-xs"></i>
            <span>新建任务</span>
          </button>
        </div>

        <div id="month-selected-tasks-container" class="space-y-2 min-h-[80px]"></div>
      </div>
    </section>

  </main>

  <button id="floating-add-btn" onclick="openModal()" title="新建任务" 
    class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 bg-brand text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-2xl hover:bg-brand-hover active:scale-90 transition-all duration-200 border-4 border-white/80">
    <i class="fa-solid fa-plus"></i>
  </button>

  <!-- Edit & Add Task Modal -->
  <div id="task-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center hidden fade-in">
    <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
      
      <div class="flex items-center justify-between border-b border-gray-100 pb-3">
        <h3 id="modal-title" class="text-base font-bold text-gray-800">编辑任务</h3>
        <button onclick="closeModal()" class="p-1.5 text-gray-400 hover:text-gray-600 rounded-full hover:bg-gray-100 transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="task-form" onsubmit="event.preventDefault(); saveTask();" class="space-y-3.5">
        <input type="hidden" id="edit-task-id">

        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">任务名称</label>
          <div class="relative flex items-center gap-2">
            <input type="text" id="edit-task-title" required placeholder="请输入任务名称..."
              class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand">
            <button type="button" id="mic-btn" onclick="toggleVoiceInput()" title="语音输入"
              class="p-2 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-xl transition flex items-center justify-center shrink-0 active:scale-95">
              <i class="fa-solid fa-microphone text-sm"></i>
            </button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="text-xs font-bold text-gray-600">截止日期 (可选)</label>
              <button type="button" onclick="clearModalDate()" class="text-[10px] text-brand font-medium hover:underline">清除日期</button>
            </div>
            <input type="date" id="edit-task-duedate" 
              class="w-full px-3 py-2 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand/30">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">截止时间 (可选)</label>
            <input type="time" id="edit-task-duetime" 
              class="w-full px-3 py-2 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand/30">
          </div>
        </div>

        <div class="flex items-center space-x-2 pt-1">
          <input type="checkbox" id="edit-task-priority" class="w-4 h-4 text-brand rounded focus:ring-brand accent-[#4772FA]">
          <label for="edit-task-priority" class="text-xs font-bold text-gray-700 cursor-pointer select-none flex items-center space-x-1">
            <span class="w-2.5 h-2.5 rounded-full bg-red-500 inline-block"></span>
            <span>设为高优先级</span>
          </label>
        </div>

        <div class="space-y-2 pt-1 border-t border-gray-100">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">重复规则</label>
              <select id="edit-task-repeat" onchange="handleRepeatTypeChange()"
                class="w-full px-3 py-2 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand/30">
                <option value="none">不重复</option>
                <option value="daily">每天</option>
                <option value="weekly">每周</option>
                <option value="monthly">每月</option>
                <option value="weekday">工作日(周一至周五)</option>
                <option value="interval">每隔 N 天 (自定义)</option>
              </select>
            </div>
            <div id="repeat-interval-container" class="hidden">
              <label class="block text-xs font-bold text-gray-600 mb-1">间隔天数</label>
              <input type="number" id="edit-task-interval" min="1" value="2"
                class="w-full px-3 py-2 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand/30">
            </div>
          </div>

          <div id="repeat-end-container" class="hidden grid grid-cols-2 gap-2 pt-1">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">重复结束条件</label>
              <select id="edit-task-repeat-endtype" onchange="handleRepeatEndTypeChange()"
                class="w-full px-3 py-2 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand/30">
                <option value="infinite">无限重复</option>
                <option value="count">指定重复次数</option>
              </select>
            </div>
            <div id="repeat-count-container" class="hidden">
              <label class="block text-xs font-bold text-gray-600 mb-1">剩余重复次数</label>
              <input type="number" id="edit-task-repeat-count" min="1" value="5"
                class="w-full px-3 py-2 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand/30">
            </div>
          </div>
        </div>

        <div class="space-y-2 pt-1 border-t border-gray-100">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">提醒时间</label>
              <input type="datetime-local" id="edit-task-reminder" onchange="autoRequestNotificationPermission()"
                class="w-full px-3 py-2 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand/30">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">提示铃声</label>
              <select id="edit-task-ringtone" class="w-full px-3 py-2 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand/30">
                <option value="chime">清脆和弦 (默认)</option>
                <option value="bell">经典响铃</option>
                <option value="alarm">急促闹钟</option>
              </select>
            </div>
          </div>
        </div>

        <div class="flex items-center justify-between pt-3 border-t border-gray-100">
          <button type="button" id="delete-task-btn" onclick="deleteCurrentModalTask()" class="px-3.5 py-2 text-xs font-bold text-red-500 hover:bg-red-50 rounded-xl transition hidden">
            <i class="fa-regular fa-trash-can mr-1"></i>删除任务
          </button>
          <div class="flex items-center space-x-2 ml-auto">
            <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-semibold text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-xl transition">取消</button>
            <button type="submit" class="px-5 py-2 text-xs font-semibold text-white bg-brand hover:bg-brand-hover rounded-xl shadow-md transition active:scale-95">保存</button>
          </div>
        </div>

      </form>

    </div>
  </div>

  <!-- Alarm Popup Modal -->
  <div id="alarm-popup-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-center justify-center hidden fade-in p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 text-center space-y-4 shadow-2xl border-2 border-brand/30 alarm-ring">
      <div class="w-16 h-16 bg-brand/10 text-brand rounded-full flex items-center justify-center mx-auto text-2xl">
        <i class="fa-solid fa-bell text-brand animate-bounce"></i>
      </div>
      <div>
        <span class="text-xs font-bold text-brand uppercase tracking-wider">系统级任务提醒</span>
        <h3 id="alarm-popup-title" class="text-lg font-bold text-gray-900 mt-1">任务名称</h3>
        <p id="alarm-popup-time" class="text-xs text-gray-400 mt-1">提醒时间</p>
      </div>
      <div class="pt-2">
        <button onclick="dismissAlarmModal()" class="w-full py-3 bg-brand text-white font-bold text-sm rounded-2xl shadow-lg hover:bg-brand-hover active:scale-95 transition">
          关闭提醒并确认
        </button>
      </div>
    </div>
  </div>

  <script>
    let tasks = [];
    let currentView = 'list';
    let currentDayDate = new Date();
    let currentWeekStartDate = getMonday(new Date());
    let currentMonthDate = new Date();
    let selectedMonthDate = getISODateString(new Date());
    let speechRecognition = null;
    let isListening = false;
    let isCompletedListOpen = false;
    let activeAlarmInterval = null;

    const HOLIDAYS_2026 = {
      '2026-01-01': { name: '元旦', type: 'rest', tag: '休' },
      '2026-02-16': { name: '除夕', type: 'rest', tag: '休' },
      '2026-02-17': { name: '春节', type: 'rest', tag: '休' },
      '2026-02-18': { name: '初二', type: 'rest', tag: '休' },
      '2026-02-19': { name: '初三', type: 'rest', tag: '休' },
      '2026-02-20': { name: '初四', type: 'rest', tag: '休' },
      '2026-04-05': { name: '清明节', type: 'rest', tag: '休' },
      '2026-05-01': { name: '劳动节', type: 'rest', tag: '休' },
      '2026-06-19': { name: '端午节', type: 'rest', tag: '休' },
      '2026-09-25': { name: '中秋节', type: 'rest', tag: '休' },
      '2026-10-01': { name: '国庆节', type: 'rest', tag: '休' },
      '2026-10-02': { name: '国庆假期', type: 'rest', tag: '休' },
      '2026-10-03': { name: '国庆假期', type: 'rest', tag: '休' },
      '2026-10-10': { name: '调休补班', type: 'work', tag: '班' }
    };

    window.addEventListener('DOMContentLoaded', () => {
      loadTasks();
      initSpeechRecognition();
      switchView('list');

      setInterval(checkReminders, 15000);
      checkReminders();
      syncRemindersToSW();
    });

    function getDemoTasks() {
      const todayStr = getISODateString(new Date());
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const tomorrowStr = getISODateString(tomorrow);

      return [
        {
          id: 'demo-1',
          title: '欢迎使用 MyTodo 个人任务与日历',
          dueDate: todayStr,
          dueTime: '18:00',
          priority: 3,
          completed: false,
          repeat: 'none',
          reminder: '',
          ringtone: 'chime'
        },
        {
          id: 'demo-2',
          title: '切换顶部选项卡体验“日、周、月”日历视图',
          dueDate: todayStr,
          dueTime: '20:00',
          priority: 0,
          completed: false,
          repeat: 'none',
          reminder: '',
          ringtone: 'chime'
        },
        {
          id: 'demo-3',
          title: '点击底部加号按钮新建定时与周期提醒任务',
          dueDate: tomorrowStr,
          dueTime: '09:00',
          priority: 0,
          completed: false,
          repeat: 'daily',
          reminder: '',
          ringtone: 'bell'
        }
      ];
    }

    function loadTasks() {
      try {
        const saved = localStorage.getItem('mytodo_tasks');
        tasks = saved ? JSON.parse(saved) : getDemoTasks();
      } catch (e) {
        tasks = getDemoTasks();
      }
    }

    function saveTasks() {
      localStorage.setItem('mytodo_tasks', JSON.stringify(tasks));
      syncRemindersToSW();
      renderCurrentView();
    }

    function switchView(viewName) {
      currentView = viewName;
      const tabs = ['list', 'day', 'week', 'month'];
      tabs.forEach(v => {
        const tabBtn = document.getElementById(`tab-${v}`);
        const panel = document.getElementById(`view-${v}`);
        if (v === viewName) {
          if (tabBtn) tabBtn.className = 'view-tab px-3 py-1.5 rounded-lg transition-all bg-white text-brand font-bold shadow-sm';
          if (panel) panel.classList.remove('hidden');
        } else {
          if (tabBtn) tabBtn.className = 'view-tab px-3 py-1.5 rounded-lg transition-all text-gray-600 hover:text-gray-900';
          if (panel) panel.classList.add('hidden');
        }
      });
      renderCurrentView();
    }

    function renderCurrentView() {
      if (currentView === 'list') renderListView();
      else if (currentView === 'day') renderDayView();
      else if (currentView === 'week') renderWeekView();
      else if (currentView === 'month') renderMonthView();
    }

    function clearSearch() {
      const searchInput = document.getElementById('search-input');
      if (searchInput) searchInput.value = '';
      renderListView();
    }

    function toggleCompletedList() {
      isCompletedListOpen = !isCompletedListOpen;
      const container = document.getElementById('list-completed-container');
      const chevron = document.getElementById('completed-chevron');
      if (container) container.classList.toggle('hidden', !isCompletedListOpen);
      if (chevron) chevron.style.transform = isCompletedListOpen ? 'rotate(90deg)' : 'rotate(0deg)';
    }

    function renderListView() {
      const searchInput = document.getElementById('search-input');
      const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
      const clearBtn = document.getElementById('search-clear-btn');
      if (clearBtn) {
        if (query) clearBtn.classList.remove('hidden');
        else clearBtn.classList.add('hidden');
      }

      const todayStr = getISODateString(new Date());

      const filteredTasks = tasks.filter(t => {
        if (!query) return true;
        return t.title.toLowerCase().includes(query);
      });

      const todayContainer = document.getElementById('list-today-container');
      const upcomingContainer = document.getElementById('list-upcoming-container');
      const nodateContainer = document.getElementById('list-nodate-container');
      const completedContainer = document.getElementById('list-completed-container');
      const countBadge = document.getElementById('completed-count-badge');

      const todayTasks = filteredTasks.filter(t => !t.completed && t.dueDate && t.dueDate <= todayStr);
      const upcomingTasks = filteredTasks.filter(t => !t.completed && t.dueDate && t.dueDate > todayStr);
      const nodateTasks = filteredTasks.filter(t => !t.completed && !t.dueDate);
      const completedTasks = filteredTasks.filter(t => t.completed);

      todayTasks.sort((a, b) => b.priority - a.priority);
      upcomingTasks.sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || ''));

      if (todayContainer) {
        todayContainer.innerHTML = todayTasks.length > 0 
          ? todayTasks.map(t => renderTaskCardHTML(t)).join('')
          : getEmptyStateHTML('暂无今天或过期的待办任务');
      }

      if (upcomingContainer) {
        upcomingContainer.innerHTML = upcomingTasks.length > 0 
          ? upcomingTasks.map(t => renderTaskCardHTML(t)).join('')
          : getEmptyStateHTML('暂无即将到来的任务');
      }

      if (nodateContainer) {
        nodateContainer.innerHTML = nodateTasks.length > 0 
          ? nodateTasks.map(t => renderTaskCardHTML(t)).join('')
          : getEmptyStateHTML('无截止日期的任务');
      }

      if (completedContainer) {
        completedContainer.innerHTML = completedTasks.length > 0 
          ? completedTasks.map(t => renderTaskCardHTML(t)).join('')
          : getEmptyStateHTML('暂无已完成的任务');
      }

      if (countBadge) {
        countBadge.textContent = completedTasks.length;
      }
    }

    function renderDayView() {
      const titleEl = document.getElementById('day-view-title');
      const holidayEl = document.getElementById('day-view-holiday');
      const container = document.getElementById('day-tasks-container');

      const dateStr = getISODateString(currentDayDate);
      const dayName = getDayOfWeekName(currentDayDate);

      if (titleEl) {
        const y = currentDayDate.getFullYear();
        const m = currentDayDate.getMonth() + 1;
        const d = currentDayDate.getDate();
        titleEl.textContent = `${y}年${m}月${d}日 ${dayName}`;
      }

      if (holidayEl) {
        const h = HOLIDAYS_2026[dateStr];
        holidayEl.textContent = h ? `${h.name} (${h.tag})` : '';
      }

      const dayTasks = tasks.filter(t => isTaskOnDate(t, dateStr));
      
      dayTasks.sort((a, b) => {
        if (a.completed !== b.completed) return a.completed ? 1 : -1;
        if (a.dueTime && !b.dueTime) return -1;
        if (!a.dueTime && b.dueTime) return 1;
        if (a.dueTime && b.dueTime) return a.dueTime.localeCompare(b.dueTime);
        return b.priority - a.priority;
      });

      if (container) {
        container.innerHTML = dayTasks.length > 0 
          ? dayTasks.map(t => renderTaskCardHTML(t)).join('')
          : getEmptyStateHTML('此日期暂无安排任务');
      }
    }

    function navigateDay(offset) {
      currentDayDate.setDate(currentDayDate.getDate() + offset);
      renderDayView();
    }

    function navigateDayToToday() {
      currentDayDate = new Date();
      renderDayView();
    }

    function renderWeekView() {
      const titleEl = document.getElementById('week-view-title');
      const grid = document.getElementById('week-grid');

      const weekStart = new Date(currentWeekStartDate);
      const weekEnd = new Date(currentWeekStartDate);
      weekEnd.setDate(weekEnd.getDate() + 6);

      if (titleEl) {
        const sm = weekStart.getMonth() + 1;
        const sd = weekStart.getDate();
        const em = weekEnd.getMonth() + 1;
        const ed = weekEnd.getDate();
        titleEl.textContent = `${weekStart.getFullYear()}年${sm}月${sd}日 - ${em}月${ed}日`;
      }

      if (!grid) return;

      const todayStr = getISODateString(new Date());
      let html = '';

      for (let i = 0; i < 7; i++) {
        const d = new Date(weekStart);
        d.setDate(d.getDate() + i);
        const dateStr = getISODateString(d);
        const dayTasks = tasks.filter(t => isTaskOnDate(t, dateStr));
        const isToday = (dateStr === todayStr);
        const holiday = HOLIDAYS_2026[dateStr];

        html += `
          <div class="bg-white rounded-2xl p-3 shadow-sm border ${isToday ? 'border-brand ring-1 ring-brand/30' : 'border-gray-100'} flex flex-col min-h-[160px]">
            <div class="flex items-center justify-between pb-2 border-b border-gray-100 mb-2">
              <div class="flex items-center space-x-1.5">
                <span class="text-xs font-bold ${isToday ? 'text-brand' : 'text-gray-700'}">${d.getDate()}日 (${getDayOfWeekShort(d)})</span>
                ${holiday ? `<span class="text-[9px] font-bold px-1 rounded ${holiday.type === 'rest' ? 'bg-red-100 text-red-600' : 'bg-amber-100 text-amber-600'}">${holiday.tag}</span>` : ''}
              </div>
              <span class="text-[10px] font-bold text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded-full">${dayTasks.length}</span>
            </div>
            <div class="space-y-1.5 flex-1 overflow-y-auto max-h-[220px]">
              ${dayTasks.length > 0 
                ? dayTasks.map(t => renderMicroCardHTML(t)).join('')
                : '<div class="text-[10px] text-gray-300 text-center py-4">无任务</div>'}
            </div>
          </div>
        `;
      }

      grid.innerHTML = html;
    }

    function navigateWeek(offset) {
      currentWeekStartDate.setDate(currentWeekStartDate.getDate() + (offset * 7));
      renderWeekView();
    }

    function navigateWeekToToday() {
      currentWeekStartDate = getMonday(new Date());
      renderWeekView();
    }

    function renderMonthView() {
      const titleEl = document.getElementById('month-view-title');
      const grid = document.getElementById('month-grid');

      const y = currentMonthDate.getFullYear();
      const m = currentMonthDate.getMonth();

      if (titleEl) {
        titleEl.textContent = `${y}年 ${m + 1}月`;
      }

      if (!grid) return;

      const firstDay = new Date(y, m, 1);
      const lastDay = new Date(y, m + 1, 0);

      let startDayOfWeek = firstDay.getDay();
      startDayOfWeek = startDayOfWeek === 0 ? 6 : startDayOfWeek - 1;

      const todayStr = getISODateString(new Date());
      let html = '';

      for (let i = 0; i < startDayOfWeek; i++) {
        html += `<div class="p-1 min-h-[50px] bg-gray-50/30"></div>`;
      }

      for (let day = 1; day <= lastDay.getDate(); day++) {
        const d = new Date(y, m, day);
        const dateStr = getISODateString(d);
        const dayTasks = tasks.filter(t => isTaskOnDate(t, dateStr));
        const isToday = (dateStr === todayStr);
        const isSelected = (dateStr === selectedMonthDate);
        const holiday = HOLIDAYS_2026[dateStr];

        const hasHighPrio = dayTasks.some(t => !t.completed && t.priority === 3);
        const pendingCount = dayTasks.filter(t => !t.completed).length;

        html += `
          <div onclick="selectMonthDate('${dateStr}')" 
            class="p-1 min-h-[52px] flex flex-col items-center justify-between cursor-pointer transition active:scale-95 border-b border-r border-gray-100 ${isSelected ? 'bg-indigo-50/70 font-bold' : 'hover:bg-gray-50'}">
            
            <div class="flex items-center space-x-1 w-full justify-between px-1">
              <span class="text-xs ${isToday ? 'bg-brand text-white w-5 h-5 rounded-full flex items-center justify-center font-bold text-[10px]' : (isSelected ? 'text-brand font-bold' : 'text-gray-700')}">
                ${day}
              </span>
              ${holiday ? `<span class="text-[9px] font-bold scale-75 origin-top-right ${holiday.type === 'rest' ? 'text-red-500' : 'text-amber-500'}">${holiday.tag}</span>` : ''}
            </div>

            <div class="flex items-center justify-center space-x-1 my-1">
              ${hasHighPrio ? '<span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>' : ''}
              ${pendingCount > 0 ? `<span class="w-1.5 h-1.5 rounded-full ${hasHighPrio ? 'bg-brand' : 'bg-brand'}"></span>` : ''}
              ${dayTasks.length > 0 && pendingCount === 0 ? '<span class="w-1.5 h-1.5 rounded-full bg-gray-300"></span>' : ''}
            </div>

            <div class="h-3">
              ${dayTasks.length > 0 ? `<span class="text-[9px] text-gray-400 font-semibold">${dayTasks.length}条</span>` : ''}
            </div>
          </div>
        `;
      }

      grid.innerHTML = html;
      renderMonthSelectedDayAgenda();
    }

    function selectMonthDate(dateStr) {
      selectedMonthDate = dateStr;
      renderMonthView();
    }

    function renderMonthSelectedDayAgenda() {
      const titleEl = document.getElementById('month-selected-date-title');
      const badgeEl = document.getElementById('month-selected-date-badge');
      const container = document.getElementById('month-selected-tasks-container');

      if (!selectedMonthDate) return;

      const parts = selectedMonthDate.split('-');
      const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      const dayName = getDayOfWeekName(d);

      if (titleEl) {
        titleEl.textContent = `${parseInt(parts[1])}月${parseInt(parts[2])}日 ${dayName}`;
      }

      const holiday = HOLIDAYS_2026[selectedMonthDate];
      if (badgeEl) {
        if (holiday) {
          badgeEl.classList.remove('hidden');
          badgeEl.textContent = `${holiday.name} (${holiday.tag})`;
          badgeEl.className = `text-[10px] font-bold px-2 py-0.5 rounded-full ${holiday.type === 'rest' ? 'bg-red-100 text-red-600' : 'bg-amber-100 text-amber-600'}`;
        } else {
          badgeEl.classList.add('hidden');
        }
      }

      const dayTasks = tasks.filter(t => isTaskOnDate(t, selectedMonthDate));

      if (container) {
        container.innerHTML = dayTasks.length > 0 
          ? dayTasks.map(t => renderTaskCardHTML(t)).join('')
          : getEmptyStateHTML('该选定日期无任务，点击右上角增加');
      }
    }

    function navigateMonth(offset) {
      currentMonthDate.setMonth(currentMonthDate.getMonth() + offset);
      renderMonthView();
    }

    function navigateMonthToToday() {
      currentMonthDate = new Date();
      selectedMonthDate = getISODateString(new Date());
      renderMonthView();
    }

    function addQuickTaskForSelectedMonthDate() {
      openModal(null);
      const dateInput = document.getElementById('edit-task-duedate');
      if (dateInput && selectedMonthDate) {
        dateInput.value = selectedMonthDate;
      }
    }

    function renderTaskCardHTML(t) {
      const isHighPrio = (t.priority === 3);
      const isCompleted = t.completed;
      const repeatLabel = getRepeatLabel(t);

      return `
        <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex items-center justify-between gap-3 transition hover:shadow-md">
          <div class="flex items-center space-x-3 flex-1 min-w-0">
            <button onclick="toggleTaskComplete('${t.id}', event)" class="shrink-0 text-lg text-gray-300 hover:text-brand transition active:scale-90">
              <i class="${isCompleted ? 'fa-solid fa-circle-check text-brand' : 'fa-regular fa-circle'}"></i>
            </button>
            <div onclick="openModal('${t.id}')" class="flex-1 min-w-0 cursor-pointer">
              <div class="flex items-center space-x-2">
                ${isHighPrio ? '<span class="w-2 h-2 rounded-full bg-red-500 shrink-0"></span>' : ''}
                <h4 class="text-xs sm:text-sm font-semibold ${isCompleted ? 'line-through text-gray-400' : 'text-gray-800'} truncate">
                  ${escapeHTML(t.title)}
                </h4>
              </div>
              <div class="flex items-center space-x-2 text-[11px] text-gray-400 mt-0.5 flex-wrap gap-y-1">
                ${t.dueDate ? `<span class="flex items-center"><i class="fa-regular fa-clock mr-1"></i>${t.dueDate} ${t.dueTime || ''}</span>` : '<span class="text-gray-400">无截止日期</span>'}
                ${repeatLabel ? `<span class="bg-indigo-50 text-brand px-1.5 py-0.2 rounded text-[10px] font-bold"><i class="fa-solid fa-rotate mr-1"></i>${repeatLabel}</span>` : ''}
                ${t.reminder ? '<i class="fa-solid fa-bell text-amber-500 text-[10px]" title="已设置提醒"></i>' : ''}
              </div>
            </div>
          </div>
          <button onclick="deleteTask('${t.id}', event)" class="p-1.5 text-gray-300 hover:text-red-500 rounded-lg transition shrink-0">
            <i class="fa-regular fa-trash-can text-xs"></i>
          </button>
        </div>
      `;
    }

    function renderMicroCardHTML(t) {
      const isHighPrio = (t.priority === 3);
      const isCompleted = t.completed;

      return `
        <div class="bg-gray-50/80 hover:bg-gray-100 rounded-xl p-2 transition text-xs flex items-center justify-between gap-1.5 border border-gray-100">
          <button onclick="toggleTaskComplete('${t.id}', event)" class="shrink-0 text-xs text-gray-300 hover:text-brand transition">
            <i class="${isCompleted ? 'fa-solid fa-circle-check text-brand' : 'fa-regular fa-circle'}"></i>
          </button>
          <div onclick="openModal('${t.id}')" class="flex-1 min-w-0 cursor-pointer">
            <div class="flex items-center space-x-1">
              ${isHighPrio ? '<span class="w-1.5 h-1.5 rounded-full bg-red-500 shrink-0"></span>' : ''}
              <span class="truncate font-medium text-[11px] ${isCompleted ? 'line-through text-gray-400' : 'text-gray-800'}">${escapeHTML(t.title)}</span>
            </div>
            ${t.dueTime ? `<div class="text-[9px] text-gray-400 mt-0.5">${t.dueTime}</div>` : ''}
          </div>
        </div>
      `;
    }

    function getEmptyStateHTML(msg) {
      return `
        <div class="bg-white/60 rounded-2xl p-4 text-center border border-dashed border-gray-200">
          <p class="text-xs text-gray-400 font-medium">${msg}</p>
        </div>
      `;
    }

    function toggleTaskComplete(id, event) {
      if (event) event.stopPropagation();
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      if (!task.completed) {
        if (task.repeat && task.repeat !== 'none') {
          if (task.repeatEndType === 'count') {
            task.repeatCount = (task.repeatCount || 1) - 1;
            if (task.repeatCount <= 0) {
              task.completed = true;
              saveTasks();
              return;
            }
          }
          if (task.dueDate) {
            task.dueDate = getNextRepeatDate(task.dueDate, task.repeat, task.repeatInterval || 1);
          }
          if (task.reminder) {
            const remDateStr = task.reminder.split('T')[0];
            const remTimeStr = task.reminder.split('T')[1] || '09:00';
            const nextRemDate = getNextRepeatDate(remDateStr, task.repeat, task.repeatInterval || 1);
            task.reminder = `${nextRemDate}T${remTimeStr}`;
          }
          task.completed = false;
          task.reminded = false;
        } else {
          task.completed = true;
        }
      } else {
        task.completed = false;
      }

      saveTasks();
    }

    function deleteTask(id, event) {
      if (event) event.stopPropagation();
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
    }

    function openModal(id = null) {
      const modal = document.getElementById('task-modal');
      const deleteBtn = document.getElementById('delete-task-btn');
      const titleInput = document.getElementById('edit-task-title');
      const modalTitle = document.getElementById('modal-title');

      if (id) {
        const task = tasks.find(t => t.id === id);
        if (!task) return;

        modalTitle.textContent = '编辑任务';
        document.getElementById('edit-task-id').value = task.id;
        titleInput.value = task.title;
        document.getElementById('edit-task-duedate').value = task.dueDate || '';
        document.getElementById('edit-task-duetime').value = task.dueTime || '';
        document.getElementById('edit-task-priority').checked = (task.priority === 3);
        document.getElementById('edit-task-repeat').value = task.repeat || 'none';
        document.getElementById('edit-task-interval').value = task.repeatInterval || 2;
        document.getElementById('edit-task-repeat-endtype').value = task.repeatEndType || 'infinite';
        document.getElementById('edit-task-repeat-count').value = task.repeatCount || 5;
        document.getElementById('edit-task-reminder').value = task.reminder || '';
        document.getElementById('edit-task-ringtone').value = task.ringtone || 'chime';

        deleteBtn.classList.remove('hidden');
      } else {
        modalTitle.textContent = '新建任务';
        document.getElementById('task-form').reset();
        document.getElementById('edit-task-id').value = '';
        document.getElementById('edit-task-duedate').value = getISODateString(new Date());
        deleteBtn.classList.add('hidden');
      }

      handleRepeatTypeChange();
      handleRepeatEndTypeChange();
      modal.classList.remove('hidden');
      setTimeout(() => titleInput.focus(), 100);
    }

    function closeModal() {
      document.getElementById('task-modal').classList.add('hidden');
    }

    function clearModalDate() {
      document.getElementById('edit-task-duedate').value = '';
    }

    function handleRepeatTypeChange() {
      const val = document.getElementById('edit-task-repeat').value;
      const intervalBox = document.getElementById('repeat-interval-container');
      const endBox = document.getElementById('repeat-end-container');

      if (val === 'interval') intervalBox.classList.remove('hidden');
      else intervalBox.classList.add('hidden');

      if (val !== 'none') endBox.classList.remove('hidden');
      else endBox.classList.add('hidden');
    }

    function handleRepeatEndTypeChange() {
      const endVal = document.getElementById('edit-task-repeat-endtype').value;
      const countBox = document.getElementById('repeat-count-container');

      if (endVal === 'count') countBox.classList.remove('hidden');
      else countBox.classList.add('hidden');
    }

    function saveTask() {
      const id = document.getElementById('edit-task-id').value;
      const title = document.getElementById('edit-task-title').value.trim();
      const dueDate = document.getElementById('edit-task-duedate').value;
      const dueTime = document.getElementById('edit-task-duetime').value;
      const isHighPrio = document.getElementById('edit-task-priority').checked;
      const repeat = document.getElementById('edit-task-repeat').value;
      const interval = parseInt(document.getElementById('edit-task-interval').value) || 1;
      const endType = document.getElementById('edit-task-repeat-endtype').value;
      const count = parseInt(document.getElementById('edit-task-repeat-count').value) || 1;
      const reminder = document.getElementById('edit-task-reminder').value;
      const ringtone = document.getElementById('edit-task-ringtone').value;

      if (!title) return;

      if (id) {
        const task = tasks.find(t => t.id === id);
        if (task) {
          task.title = title;
          task.dueDate = dueDate;
          task.dueTime = dueTime;
          task.priority = isHighPrio ? 3 : 0;
          task.repeat = repeat;
          task.repeatInterval = interval;
          task.repeatEndType = endType;
          task.repeatCount = count;
          task.reminder = reminder;
          task.ringtone = ringtone;
          task.reminded = false;
        }
      } else {
        tasks.push({
          id: 'task-' + Date.now(),
          title: title,
          dueDate: dueDate,
          dueTime: dueTime,
          priority: isHighPrio ? 3 : 0,
          completed: false,
          repeat: repeat,
          repeatInterval: interval,
          repeatEndType: endType,
          repeatCount: count,
          reminder: reminder,
          reminded: false,
          ringtone: ringtone
        });
      }

      saveTasks();
      closeModal();
    }

    function deleteCurrentModalTask() {
      const id = document.getElementById('edit-task-id').value;
      if (id) {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
        closeModal();
      }
    }

    function initSpeechRecognition() {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech) return;

      speechRecognition = new Speech();
      speechRecognition.lang = 'zh-CN';
      speechRecognition.continuous = false;

      speechRecognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        if (text) {
          const input = document.getElementById('edit-task-title');
          input.value = text;
          input.focus();
        }
      };

      speechRecognition.onend = () => {
        isListening = false;
        updateMicUI();
      };

      speechRecognition.onerror = () => {
        isListening = false;
        updateMicUI();
      };
    }

    function toggleVoiceInput() {
      if (!speechRecognition) {
        alert('当前浏览器暂不支持语音识别。');
        return;
      }

      if (isListening) {
        speechRecognition.stop();
        isListening = false;
      } else {
        speechRecognition.start();
        isListening = true;
      }
      updateMicUI();
    }

    function updateMicUI() {
      const btn = document.getElementById('mic-btn');
      if (btn) {
        if (isListening) btn.classList.add('bg-red-500', 'text-white');
        else btn.classList.remove('bg-red-500', 'text-white');
      }
    }

    function autoRequestNotificationPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().then(perm => {
          if (perm === 'granted') {
            syncRemindersToSW();
          }
        });
      }
    }

    function syncRemindersToSW() {
      if (!('serviceWorker' in navigator)) return;
      const now = Date.now();
      const pending = tasks
        .filter(t => !t.completed && t.reminder && !t.reminded)
        .map(t => ({
          id: t.id,
          title: t.title,
          dueDate: t.dueDate,
          reminder: t.reminder,
          time: new Date(t.reminder).getTime()
        }))
        .filter(t => !isNaN(t.time) && t.time > now);

      const sendMsg = (targetWorker) => {
        if (targetWorker) {
          targetWorker.postMessage({
            type: 'SCHEDULE_REMINDERS',
            reminders: pending
          });
        }
      };

      if (navigator.serviceWorker.controller) {
        sendMsg(navigator.serviceWorker.controller);
      }

      navigator.serviceWorker.ready.then(reg => {
        if (reg.active) {
          sendMsg(reg.active);
        }
      }).catch(() => {});
    }

    function checkReminders() {
      const now = new Date();
      let hasChanges = false;

      tasks.forEach(t => {
        if (!t.completed && t.reminder && !t.reminded) {
          const remTime = new Date(t.reminder);
          if (!isNaN(remTime.getTime()) && now >= remTime) {
            triggerAlarm(t);
            t.reminded = true;
            hasChanges = true;
          }
        }
      });

      if (hasChanges) saveTasks();
    }

    function triggerAlarm(task) {
      startLoopingSound(task.ringtone || 'chime');
      showAlarmModal(task);

      if ('Notification' in window && Notification.permission === 'granted') {
        const title = 'MyTodo 任务提醒';
        const options = {
          body: task.title + (task.dueDate ? ` (${task.dueDate})` : ''),
          icon: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="%234772FA"><rect width="512" height="512" rx="100"/><path d="M381 181L214 348L131 265" stroke="white" stroke-width="48" stroke-linecap="round" fill="none"/></svg>',
          requireInteraction: true
        };

        if (window.swRegistration && window.swRegistration.showNotification) {
          window.swRegistration.showNotification(title, options);
        } else {
          new Notification(title, options);
        }
      }
    }

    function showAlarmModal(task) {
      document.getElementById('alarm-popup-title').textContent = task.title;
      document.getElementById('alarm-popup-time').textContent = `提醒时间：${task.reminder.replace('T', ' ')}`;
      document.getElementById('alarm-popup-modal').classList.remove('hidden');
    }

    function dismissAlarmModal() {
      stopLoopingSound();
      document.getElementById('alarm-popup-modal').classList.add('hidden');
    }

    function startLoopingSound(style) {
      stopLoopingSound();
      playRingtoneOnce(style);
      activeAlarmInterval = setInterval(() => {
        playRingtoneOnce(style);
      }, 1800);
    }

    function stopLoopingSound() {
      if (activeAlarmInterval) {
        clearInterval(activeAlarmInterval);
        activeAlarmInterval = null;
      }
    }

    function playRingtoneOnce(style) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();

        if (style === 'bell') {
          [600, 800].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.2);
            gain.gain.setValueAtTime(0.7, ctx.currentTime + idx * 0.2);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.2 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.2);
            osc.stop(ctx.currentTime + idx * 0.2 + 0.35);
          });
        } else if (style === 'alarm') {
          [880, 880, 880].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.15);
            gain.gain.setValueAtTime(0.6, ctx.currentTime + idx * 0.15);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.15 + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.15);
            osc.stop(ctx.currentTime + idx * 0.15 + 0.1);
          });
        } else {
          [523.25, 659.25, 783.99].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
            gain.gain.setValueAtTime(0.6, ctx.currentTime + idx * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.12 + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.12);
            osc.stop(ctx.currentTime + idx * 0.12 + 0.4);
          });
        }
      } catch (e) {}
    }

    function isTaskOnDate(task, dateStr) {
      if (task.dueDate === dateStr) return true;
      if (!task.repeat || task.repeat === 'none' || !task.dueDate) return false;
      if (dateStr < task.dueDate) return false;

      const start = new Date(task.dueDate + 'T00:00:00');
      const target = new Date(dateStr + 'T00:00:00');

      if (task.repeat === 'daily') return true;
      if (task.repeat === 'weekly') return start.getDay() === target.getDay();
      if (task.repeat === 'monthly') return start.getDate() === target.getDate();
      if (task.repeat === 'weekday') {
        const day = target.getDay();
        return day >= 1 && day <= 5;
      }
      if (task.repeat === 'interval') {
        const diffDays = Math.round((target - start) / (1000 * 60 * 60 * 24));
        const step = task.repeatInterval || 1;
        return diffDays >= 0 && diffDays % step === 0;
      }
      return false;
    }

    function getNextRepeatDate(currentDateStr, repeatType, interval = 1) {
      const d = new Date(currentDateStr + 'T00:00:00');
      if (isNaN(d.getTime())) return currentDateStr;

      if (repeatType === 'daily') {
        d.setDate(d.getDate() + 1);
      } else if (repeatType === 'weekly') {
        d.setDate(d.getDate() + 7);
      } else if (repeatType === 'monthly') {
        const origDate = d.getDate();
        d.setMonth(d.getMonth() + 1);
        if (d.getDate() < origDate) {
          d.setDate(0);
        }
      } else if (repeatType === 'weekday') {
        do {
          d.setDate(d.getDate() + 1);
        } while (d.getDay() === 0 || d.getDay() === 6);
      } else if (repeatType === 'interval') {
        d.setDate(d.getDate() + interval);
      }

      return getISODateString(d);
    }

    function getRepeatLabel(t) {
      let base = '';
      if (t.repeat === 'daily') base = '每天';
      else if (t.repeat === 'weekly') base = '每周';
      else if (t.repeat === 'monthly') base = '每月';
      else if (t.repeat === 'weekday') base = '工作日';
      else if (t.repeat === 'interval') base = `每${t.repeatInterval || 1}天`;

      if (t.repeatEndType === 'count') {
        base += ` (剩${t.repeatCount || 0}次)`;
      }
      return base;
    }

    function getISODateString(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function getDayOfWeekName(d) {
      const names = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      return names[d.getDay()];
    }

    function getDayOfWeekShort(d) {
      const names = ['日', '一', '二', '三', '四', '五', '六'];
      return names[d.getDay()];
    }

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
