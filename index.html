      '2026-09-27': { name: '国庆补班', type: 'work' },
      '2026-10-10': { name: '国庆补班', type: 'work' }
    };

    /**
     * 获取指定日期的节日/工作日状态信息
     */
    function getHolidayInfo(dateStr) {
      if (!dateStr) return null;
      const mmdd = dateStr.slice(5); // 'MM-DD'
      
      const specific = HOLIDAY_MAP[dateStr];
      if (specific) {
        return {
          name: specific.name,
          type: specific.type || (specific.rest ? 'rest' : 'normal'),
          tag: specific.type === 'rest' ? '休' : (specific.type === 'work' ? '班' : '')
        };
      }

      const general = HOLIDAY_MAP[mmdd];
      if (general) {
        return {
          name: general.name,
          type: general.rest ? 'rest' : 'normal',
          tag: general.rest ? '休' : ''
        };
      }

      // 常规周末检测
      const d = new Date(dateStr + 'T00:00:00');
      if (!isNaN(d.getTime())) {
        const day = d.getDay();
        if (day === 0 || day === 6) {
          return { name: '', type: 'weekend', tag: '' };
        }
      }

      return { name: '', type: 'workday', tag: '' };
    }

    const PRIORITY_MAP = {
      0: { label: '无', bg: 'bg-gray-300', border: 'border-gray-200' },
      3: { label: '高', bg: 'bg-red-500', border: 'border-red-500' }
    };

    /* Helper Utilities */
    function getISODateString(d) {
      if (!d) return '';
      const date = new Date(d);
      if (isNaN(date.getTime())) return '';
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function getDayOfWeekName(d) {
      const names = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      return names[d.getDay()];
    }

    function escapeHTML(str) {
      return (str || '').replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    /**
     * 判断任务在指定日期 (targetDateStr: 'YYYY-MM-DD') 是否应该出现（包含重复规则计算）
     */
    function isTaskOnDate(task, targetDateStr) {
      if (!task.dueDate) return false;
      if (task.dueDate === targetDateStr) return true;
      if (!task.repeat || task.repeat === 'none') return false;

      const start = new Date(task.dueDate + 'T00:00:00');
      const target = new Date(targetDateStr + 'T00:00:00');

      if (isNaN(start.getTime()) || isNaN(target.getTime())) return false;
      if (target < start) return false;

      const diffMs = target.getTime() - start.getTime();
      const diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));

      const countLimit = (task.repeatEndMode === 'count' && typeof task.repeatCount === 'number') 
        ? task.repeatCount 
        : Infinity;

      if (task.repeat === 'daily') {
        const occurrenceIndex = diffDays;
        return occurrenceIndex >= 0 && occurrenceIndex < countLimit;
      }

      if (task.repeat === 'custom_days') {
        const interval = parseInt(task.repeatInterval, 10) || 1;
        if (diffDays % interval === 0) {
          const occurrenceIndex = diffDays / interval;
          return occurrenceIndex >= 0 && occurrenceIndex < countLimit;
        }
        return false;
      }

      if (task.repeat === 'weekly') {
        if (diffDays % 7 === 0) {
          const occurrenceIndex = diffDays / 7;
          return occurrenceIndex >= 0 && occurrenceIndex < countLimit;
        }
        return false;
      }

      if (task.repeat === 'weekday') {
        const dayOfWeek = target.getDay();
        if (dayOfWeek === 0 || dayOfWeek === 6) return false; // 排除周末
        
        if (task.repeatEndMode === 'count') {
          let weekdayCount = 0;
          let cur = new Date(start);
          while (cur <= target) {
            const dow = cur.getDay();
            if (dow !== 0 && dow !== 6) {
              weekdayCount++;
            }
            cur.setDate(cur.getDate() + 1);
          }
          return weekdayCount > 0 && weekdayCount <= countLimit;
        }
        return true;
      }

      if (task.repeat === 'monthly') {
        const diffMonths = (target.getFullYear() - start.getFullYear()) * 12 + (target.getMonth() - start.getMonth());
        if (diffMonths < 0 || diffMonths >= countLimit) return false;

        const projected = new Date(start);
        const originalDay = start.getDate();
        projected.setMonth(projected.getMonth() + diffMonths);
        if (projected.getDate() !== originalDay) {
          projected.setDate(0);
        }
        return getISODateString(projected) === targetDateStr;
      }

      return false;
    }

    function handleQuickAddKeydown(e) {
      if (e.key === 'Enter') {

    function calculateNextDueDate(baseDateStr, repeatType, intervalDays = 1) {
      let base = baseDateStr ? new Date(baseDateStr + 'T00:00:00') : new Date();
      if (isNaN(base.getTime())) base = new Date();

      if (repeatType === 'daily') {
        base.setDate(base.getDate() + 1);
      } else if (repeatType === 'custom_days') {
        const days = parseInt(intervalDays, 10) || 1;
        base.setDate(base.getDate() + days);
      } else if (repeatType === 'weekly') {
        base.setDate(base.getDate() + 7);
      } else if (repeatType === 'monthly') {
        const originalDay = base.getDate();
        base.setMonth(base.getMonth() + 1);
        if (base.getDate() !== originalDay) {
          base.setDate(0);
        }
      } else if (repeatType === 'weekday') {
        do {
          base.setDate(base.getDate() + 1);
        } while (base.getDay() === 0 || base.getDay() === 6);
      }

      return getISODateString(base);
    }

    function toggleTaskComplete(taskId) {
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;

      if (!task.completed) {
        if (task.repeat && task.repeat !== 'none') {
          if (task.repeatEndMode === 'count') {
            if (typeof task.repeatCount !== 'number') task.repeatCount = 1;
            task.repeatCount--;

            if (task.repeatCount <= 0) {
              task.completed = true;
              task.repeat = 'none';
              showToast('已达到设定重复次数，任务已最终完成');
              saveTasks();
              return;
            }
          }

          const baseDate = task.dueDate || getISODateString(new Date());
          const nextDueDate = calculateNextDueDate(baseDate, task.repeat, task.repeatInterval);
          
          let nextReminder = '';
          if (task.reminder) {
            const oldDue = new Date(baseDate + 'T00:00:00').getTime();
            const newDue = new Date(nextDueDate + 'T00:00:00').getTime();
            const diffMs = newDue - oldDue;
            
            const remDate = new Date(task.reminder);
            if (!isNaN(remDate.getTime())) {
              const newRemDate = new Date(remDate.getTime() + (isNaN(diffMs) ? 86400000 : diffMs));
              nextReminder = newRemDate.toISOString().slice(0, 16);
            }
          }

          task.dueDate = nextDueDate;
          task.reminder = nextReminder;
          task.completed = false;
          task.reminded = false;
          
          const countInfo = task.repeatEndMode === 'count' ? ` (还剩 ${task.repeatCount} 次)` : '';
          showToast(`重复任务推进至: ${nextDueDate}${countInfo}`);
        } else {
          task.completed = true;
          showToast('任务已完成');
        }
      } else {
        task.completed = false;
      }

      saveTasks();
    }

            <div class="min-w-0 flex-1 cursor-pointer" onclick="openModal('${task.id}')">

                  : ''}
              </div>

              <div class="flex items-center space-x-3 text-xs text-gray-400 mt-1">
                <span class="${isOverdue ? 'text-red-500 font-bold' : ''}">
                  <i class="fa-regular fa-calendar mr-1"></i>${task.dueDate ? task.dueDate + (task.dueTime ? ' ' + task.dueTime : '') : '无截止日期'}
                </span>
                ${task.reminder ? '<span class="text-amber-500"><i class="fa-regular fa-bell mr-1"></i>提醒</span>' : ''}
              </div>
            </div>
          </div>

          <button onclick="openModal('${task.id}')" class="text-gray-300 hover:text-brand p-1.5 rounded-lg hover:bg-gray-50 transition">
            <i class="fa-solid fa-pen-to-square"></i>
          </button>
        </div>
      `;
    }

    function renderMicroCardHTML(task) {
      const pInfo = PRIORITY_MAP[task.priority] || PRIORITY_MAP[0];
      const isCompleted = task.completed;

      return `
        <div class="bg-white rounded-lg p-1.5 shadow-sm border ${pInfo.border} flex items-center justify-between gap-1.5 hover:shadow transition group text-xs">
          <div class="flex items-center space-x-1.5 min-w-0 flex-1">
            <div class="w-1 h-3.5 rounded-full ${pInfo.bg} flex-shrink-0"></div>

            <button onclick="event.stopPropagation(); toggleTaskComplete('${task.id}')" class="text-gray-300 hover:text-brand flex-shrink-0">
              ${isCompleted 
                ? '<i class="fa-solid fa-circle-check text-brand text-xs"></i>' 
                : '<i class="fa-regular fa-circle text-xs"></i>'}
            </button>

            <span onclick="openModal('${task.id}')" class="truncate font-medium text-gray-700 cursor-pointer flex-1 ${isCompleted ? 'line-through text-gray-400' : ''}" title="${escapeHTML(task.title)}">

    function getRepeatLabel(repeat, repeatInterval, repeatEndMode, repeatCount) {
      let label = '';
      if (repeat === 'custom_days') {
        label = `每${repeatInterval || 1}天`;
      } else {
        const map = { daily: '每天', weekly: '每周', monthly: '每月', weekday: '工作日' };
        label = map[repeat] || '';
      }

      if (label && repeatEndMode === 'count' && typeof repeatCount === 'number') {
        label += ` (剩${repeatCount}次)`;
      }
      return label;
    }

    function renderListView() {
      const container = document.getElementById('list-task-container');
      const filter = document.getElementById('list-filter').value;
      const totalCount = document.getElementById('list-total-count');

      let filtered = [...tasks];
      const todayStr = getISODateString(new Date());

      if (filter === 'pending') filtered = filtered.filter(t => !t.completed);
      else if (filter === 'completed') filtered = filtered.filter(t => t.completed);
      else if (filter === 'today') filtered = filtered.filter(t => isTaskOnDate(t, todayStr));

      filtered.sort((a, b) => {
        if (a.completed !== b.completed) return a.completed ? 1 : -1;
        if (a.priority !== b.priority) return b.priority - a.priority;
        if (!a.dueDate) return 1;
        if (!b.dueDate) return -1;
        return a.dueDate.localeCompare(b.dueDate);
      });

      totalCount.textContent = filtered.length;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-2xl text-center text-gray-400 border border-gray-100">
            <i class="fa-solid fa-clipboard-check text-4xl text-gray-200 mb-2"></i>
            <p class="text-sm">没有找到符合条件的任务</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(t => renderTaskCardHTML(t)).join('');
    }

    function renderMonthView() {
      const year = currentMonthDate.getFullYear();
      const month = currentMonthDate.getMonth();
      document.getElementById('month-view-title').textContent = `${year}年 ${month + 1}月`;

      const grid = document.getElementById('month-grid');
      grid.innerHTML = '';

      const firstDayOfMonth = new Date(year, month, 1);
      let startingDayOfWeek = firstDayOfMonth.getDay();
      startingDayOfWeek = startingDayOfWeek === 0 ? 6 : startingDayOfWeek - 1;

      const lastDayOfMonth = new Date(year, month + 1, 0).getDate();
      const prevMonthLastDay = new Date(year, month, 0).getDate();

      // Trailing days of previous month
      for (let i = startingDayOfWeek - 1; i >= 0; i--) {
        const dayNum = prevMonthLastDay - i;
        const cell = document.createElement('div');
        cell.className = 'bg-gray-50/50 p-1.5 min-h-[100px] text-gray-300 text-xs';
        cell.innerHTML = `<div class="font-semibold mb-1 text-right text-gray-300">${dayNum}</div>`;
        grid.appendChild(cell);
      }

      const todayStr = getISODateString(new Date());

      // Current month days
      for (let d = 1; d <= lastDayOfMonth; d++) {
        const dateObj = new Date(year, month, d);
        const dateStr = getISODateString(dateObj);
        const isToday = dateStr === todayStr;

        const holidayInfo = getHolidayInfo(dateStr);
        const dayTasks = tasks.filter(t => isTaskOnDate(t, dateStr));

        const cell = document.createElement('div');
        cell.className = `bg-white p-1.5 min-h-[110px] max-h-[180px] overflow-y-auto space-y-1 transition ${isToday ? 'ring-2 ring-brand ring-inset bg-indigo-50/20' : ''}`;

        let cellHTML = `
          <div class="flex items-center justify-between mb-1">
            <div class="flex items-center space-x-1">
              <span class="text-xs font-bold ${isToday ? 'bg-brand text-white w-5 h-5 rounded-full flex items-center justify-center' : 'text-gray-700'}">${d}</span>

          <div class="space-y-1">

        dayTasks.forEach(task => {
          cellHTML += renderMicroCardHTML(task);
        });

        cellHTML += '</div>';
        cell.innerHTML = cellHTML;
        grid.appendChild(cell);
      }

      // Next month trailing days
      const totalCells = startingDayOfWeek + lastDayOfMonth;
      const trailingDays = (7 - (totalCells % 7)) % 7;
      for (let i = 1; i <= trailingDays; i++) {
        const cell = document.createElement('div');
        cell.className = 'bg-gray-50/50 p-1.5 min-h-[100px] text-gray-300 text-xs';
        cell.innerHTML = `<div class="font-semibold mb-1 text-right text-gray-300">${i}</div>`;
        grid.appendChild(cell);
      }
    }

    }
    function navigateDayToToday() {
      currentDayDate = new Date();
      renderDayView();
    }

    function navigateWeek(delta) {
      currentWeekStartDate.setDate(currentWeekStartDate.getDate() + (delta * 7));
      renderWeekView();
    }
    function navigateWeekToToday() {
      currentWeekStartDate = getMonday(new Date());
      renderWeekView();
    }

    function navigateMonth(delta) {
      currentMonthDate.setMonth(currentMonthDate.getMonth() + delta);
      renderMonthView();
    }
    function navigateMonthToToday() {
      currentMonthDate = new Date();
      renderMonthView();
    }

    function handleRepeatChange() {
      const repeatVal = document.getElementById('edit-task-repeat').value;
      const optionsContainer = document.getElementById('repeat-options-container');
      const intervalContainer = document.getElementById('repeat-interval-container');
      const countContainer = document.getElementById('repeat-count-container');
      const endMode = document.getElementById('edit-task-repeat-end-mode').value;

      if (repeatVal !== 'none') {
        optionsContainer.classList.remove('hidden');
        if (repeatVal === 'custom_days') {
          intervalContainer.classList.remove('hidden');
        } else {
          intervalContainer.classList.add('hidden');
        }

        if (endMode === 'count') {
          countContainer.classList.remove('hidden');
        } else {
          countContainer.classList.add('hidden');
        }
      } else {
        optionsContainer.classList.add('hidden');
      }
    }

    function openModal(taskId) {
      const modal = document.getElementById('task-modal');
      const form = document.getElementById('task-form');

      if (taskId) {
        const task = tasks.find(t => t.id === taskId);
        if (!task) return;

        document.getElementById('modal-heading').textContent = '编辑任务';
        document.getElementById('edit-task-id').value = task.id;
        document.getElementById('edit-task-title').value = task.title;
        document.getElementById('edit-task-duedate').value = task.dueDate || '';
        document.getElementById('edit-task-duetime').value = task.dueTime || '';
        document.getElementById('edit-task-high-priority').checked = (task.priority === 3);
        document.getElementById('edit-task-repeat').value = task.repeat || 'none';
        document.getElementById('edit-task-repeat-interval').value = task.repeatInterval || 2;
        document.getElementById('edit-task-repeat-end-mode').value = task.repeatEndMode || 'never';
        document.getElementById('edit-task-repeat-count').value = task.repeatCount || 5;
        handleRepeatChange();

        document.getElementById('edit-task-reminder').value = task.reminder || '';
        document.getElementById('delete-task-btn').classList.remove('hidden');
      } else {
        document.getElementById('modal-heading').textContent = '添加任务';
        form.reset();
        document.getElementById('edit-task-id').value = '';
        document.getElementById('edit-task-duedate').value = getISODateString(new Date());
        document.getElementById('edit-task-high-priority').checked = false;
        document.getElementById('edit-task-repeat').value = 'none';
        document.getElementById('edit-task-repeat-interval').value = 2;
        document.getElementById('edit-task-repeat-end-mode').value = 'never';
        document.getElementById('edit-task-repeat-count').value = 5;
        handleRepeatChange();

        document.getElementById('delete-task-btn').classList.add('hidden');
      }

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('task-modal').classList.add('hidden');
    }

    function handleSaveTask(e) {
      e.preventDefault();
      const id = document.getElementById('edit-task-id').value;
      const title = document.getElementById('edit-task-title').value.trim();
      const dueDate = document.getElementById('edit-task-duedate').value;
      const dueTime = document.getElementById('edit-task-duetime').value;
      const isHighPriority = document.getElementById('edit-task-high-priority').checked;
      const priority = isHighPriority ? 3 : 0;
      
      const repeat = document.getElementById('edit-task-repeat').value;
      const repeatInterval = parseInt(document.getElementById('edit-task-repeat-interval').value, 10) || 1;
      const repeatEndMode = document.getElementById('edit-task-repeat-end-mode').value;
      const repeatCount = parseInt(document.getElementById('edit-task-repeat-count').value, 10) || 1;
      const reminder = document.getElementById('edit-task-reminder').value;

      if (!title) return;

      if (id) {
        const task = tasks.find(t => t.id === id);
        if (task) {
          task.title = title;
          task.dueDate = dueDate;
          task.dueTime = dueTime;
          task.priority = priority;
          task.repeat = repeat;
          task.repeatInterval = repeatInterval;
          task.repeatEndMode = repeatEndMode;
          task.repeatCount = repeatCount;
          
          if (task.reminder !== reminder) {
            task.reminder = reminder;
            task.reminded = false;
          }
        }
        showToast('任务更新成功');
      } else {
        const newTask = {
          id: 'task_' + Date.now(),
          title,
          dueDate,
          dueTime,
          priority,
          completed: false,
          repeat,
          repeatInterval,
          repeatEndMode,
          repeatCount,
          reminder,
          reminded: false
        };
        tasks.push(newTask);
        showToast('任务创建成功');
      }

      saveTasks();
      closeModal();
    }

    function handleDeleteTask() {
      const id = document.getElementById('edit-task-id').value;
      if (!id) return;

      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      closeModal();
      showToast('任务已删除');
    }

    function playChimeSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);

        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch (e) {
        console.error('Web Audio chime error:', e);
      }
    }

    function checkReminders() {
      const now = new Date();
      let hasChanges = false;

      tasks.forEach(task => {
        if (!task.completed && task.reminder && !task.reminded) {
          const reminderTime = new Date(task.reminder);
          if (!isNaN(reminderTime.getTime()) && now >= reminderTime) {
            
            if ('Notification' in window) {
              if (Notification.permission === 'granted') {
                new Notification('MyTodo 任务提醒', { body: task.title });
              } else if (Notification.permission !== 'denied') {
                Notification.requestPermission();
              }
            }

            playChimeSound();
            task.reminded = true;
            hasChanges = true;
            showToast(`提醒: ${task.title}`);
          }
        }
      });

      if (hasChanges) {
        saveTasks();
      }
    }

    function toggleVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast('当前浏览器不支持 Web Speech 语音识别 API', true);
        return;
      }

      const micBtn = document.getElementById('voice-btn');

      if (isListening) {
        if (speechRecognition) speechRecognition.stop();
        return;
      }

      speechRecognition = new SpeechRecognition();
      speechRecognition.lang = 'zh-CN';
      speechRecognition.interimResults = false;

      speechRecognition.onstart = function() {
        isListening = true;
        micBtn.classList.add('recording-pulse');
        showToast('正在聆听，请说话...');
      };

      speechRecognition.onresult = function(e) {
        const transcript = e.results[0][0].transcript;
        if (transcript) {
          document.getElementById('quick-task-title').value = transcript;
          showToast('语音识别成功');
        }
      };

      speechRecognition.onerror = function(e) {
        showToast('语音识别失败: ' + e.error, true);
        stopVoiceListening();
      };

      speechRecognition.onend = function() {
        stopVoiceListening();
      };

      speechRecognition.start();
    }

    function stopVoiceListening() {
      isListening = false;
      const micBtn = document.getElementById('voice-btn');
      if (micBtn) micBtn.classList.remove('recording-pulse');
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      const toastIcon = document.getElementById('toast-icon');

      toastMsg.textContent = msg;
      toastIcon.className = isError 
        ? 'fa-solid fa-circle-exclamation text-red-400' 
        : 'fa-solid fa-circle-check text-emerald-400';

      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 3000);
    }

    /* Inline Service Worker Dynamic Registration for PWA Auditing */
    function registerInlineServiceWorker() {
      if ('serviceWorker' in navigator) {
        const swScript = `
          const CACHE_NAME = 'mytodo-pwa-v1';
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
          self.addEventListener('fetch', (e) => {
            // Network first with fallback or standard pass-through
            e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
          });
        `;
        const blob = new Blob([swScript], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(err => {
          console.log('PWA Service Worker Registration Note:', err);
        });
      }
    }

    /* Initial App Startup */
    window.onload = function() {
      registerInlineServiceWorker();
      loadTasks();
      switchView('list');

      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }

      setInterval(checkReminders, 30000);
      checkReminders();
    };
  </script>
